name: Norwegian Localization CI

on:
  push:
    branches:
      - feature/l10n-no
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norwegian-l10n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  norwegian-localization:
    name: Norway localization regression
    runs-on:
      - self-hosted
      - Linux
      - elitebook-mint
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Set up Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.18 --activate
          node --version
          yarn --version

      - name: Verify SAF-T validator
        shell: bash
        run: |
          command -v xmllint
          xmllint --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Norway setup regression
        run: yarn test tests/testNorwaySetup.spec.ts

      - name: Norway accounting regression
        run: yarn test tests/testNorwayAccounting.spec.ts

      - name: Norway document compliance regression
        run: yarn test tests/testNorwayDocuments.spec.ts

      - name: Norway office export regression
        run: yarn test tests/testNorwayExports.spec.ts

      - name: Verify office export archives
        shell: bash
        run: command -v unzip

      - name: Norway SAF-T regression
        run: yarn test tests/testNorwaySaft.spec.ts

      - name: Norway full-year regression
        run: yarn test tests/testNorwayYearEnd.spec.ts

      - name: Norway discount VAT regression
        run: yarn test tests/testNorwayDiscounts.spec.ts

      - name: Norway persistence regression
        run: yarn test tests/testNorwayPersistence.spec.ts

      - name: Build application
        run: yarn build --nopackage

      - name: Package Linux AppImage
        shell: bash
        run: |
          : > log_creds.txt
          yarn build --nosign --linux AppImage --x64 --publish never
          APPIMAGE="$(find dist_electron/bundled -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -d squashfs-root/usr

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: frappe-books-norway-linux-x64
          path: dist_electron/bundled/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        run: yarn lint
