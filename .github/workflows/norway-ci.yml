name: Norwegian Localization CI

on:
  push:
    branches:
      - feature/l10n-no
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norwegian-l10n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  norwegian-localization:
    name: Norway localization regression
    runs-on:
      - self-hosted
      - Linux
      - elitebook-mint
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Set up Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.18 --activate
          node --version
          yarn --version

      - name: Verify SAF-T validator
        shell: bash
        run: |
          command -v xmllint
          xmllint --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Norway setup regression
        run: yarn test tests/testNorwaySetup.spec.ts

      - name: Norway accounting regression
        run: yarn test tests/testNorwayAccounting.spec.ts

      - name: Norway document compliance regression
        run: yarn test tests/testNorwayDocuments.spec.ts

      - name: Norway office export regression
        env:
          NORWAY_EXPORT_ARTIFACT_DIR: ${{ runner.temp }}/norway-office
        run: yarn test tests/testNorwayExports.spec.ts

      - name: Verify office export archives
        shell: bash
        run: |
          command -v unzip
          unzip -t "$RUNNER_TEMP/norway-office/norwegian-vat.xlsx"
          unzip -t "$RUNNER_TEMP/norway-office/norwegian-vat.ods"
          unzip -t "$RUNNER_TEMP/norway-office/norwegian-general-ledger.xlsx"
          unzip -t "$RUNNER_TEMP/norway-office/norwegian-general-ledger.ods"
          unzip -p "$RUNNER_TEMP/norway-office/norwegian-general-ledger.xlsx" xl/worksheets/sheet1.xml | grep -q 't="d"'
          unzip -p "$RUNNER_TEMP/norway-office/norwegian-general-ledger.ods" content.xml | grep -q 'office:value-type="date"'

          if command -v libreoffice >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/norway-office/xlsx-check"
            mkdir -p "$RUNNER_TEMP/norway-office/ods-check"
            mkdir -p "$RUNNER_TEMP/norway-office/gl-xlsx-check"
            mkdir -p "$RUNNER_TEMP/norway-office/gl-ods-check"
            libreoffice --headless \
              -env:UserInstallation=file://"$RUNNER_TEMP"/lo-profile-xlsx \
              --convert-to csv \
              --outdir "$RUNNER_TEMP/norway-office/xlsx-check" \
              "$RUNNER_TEMP/norway-office/norwegian-vat.xlsx"
            libreoffice --headless \
              -env:UserInstallation=file://"$RUNNER_TEMP"/lo-profile-ods \
              --convert-to csv \
              --outdir "$RUNNER_TEMP/norway-office/ods-check" \
              "$RUNNER_TEMP/norway-office/norwegian-vat.ods"
            test -s "$RUNNER_TEMP/norway-office/xlsx-check/norwegian-vat.csv"
            test -s "$RUNNER_TEMP/norway-office/ods-check/norwegian-vat.csv"
            grep -q "Utgående MVA 25 %" "$RUNNER_TEMP/norway-office/xlsx-check/norwegian-vat.csv"
            grep -q "Utgående MVA 25 %" "$RUNNER_TEMP/norway-office/ods-check/norwegian-vat.csv"
          fi

      - name: Norway SAF-T regression
        run: yarn test tests/testNorwaySaft.spec.ts

      - name: Norway full-year regression
        env:
          TEST_DB_PATH: ${{ runner.temp }}/cirrenix-norway-reference.books.db
          NORWAY_REFERENCE_ARTIFACT_DIR: ${{ runner.temp }}/norway-reference-review
        run: yarn test tests/testNorwayYearEnd.spec.ts

      - name: Verify Norwegian reference database
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/cirrenix-norway-reference.books.db"
          if command -v sqlite3 >/dev/null 2>&1; then
            test "$(sqlite3 "$RUNNER_TEMP/cirrenix-norway-reference.books.db" 'PRAGMA integrity_check;')" = "ok"
            sqlite3 "$RUNNER_TEMP/cirrenix-norway-reference.books.db" \
              "SELECT value FROM SingleValue WHERE parent='AccountingSettings' AND fieldname='companyName';" \
              | grep -qx 'CirreniX Test AS'
            sqlite3 "$RUNNER_TEMP/cirrenix-norway-reference.books.db" \
              "SELECT value FROM SingleValue WHERE parent='SystemSettings' AND fieldname='countryCode';" \
              | grep -qx 'no'
          fi

      - name: Upload Norwegian reference database
        uses: actions/upload-artifact@v4
        with:
          name: cirrenix-norway-reference-database
          path: ${{ runner.temp }}/cirrenix-norway-reference.books.db
          if-no-files-found: error
          retention-days: 14

      - name: Upload Norwegian accountant-review bundle
        uses: actions/upload-artifact@v4
        with:
          name: cirrenix-norway-accountant-review
          path: |
            ${{ runner.temp }}/norway-reference-review/*
            ${{ runner.temp }}/norway-office/*
          if-no-files-found: error
          retention-days: 14

      - name: Norway discount VAT regression
        run: yarn test tests/testNorwayDiscounts.spec.ts

      - name: Norway bank CSV normalization regression
        run: yarn test tests/testNorwayBankStatement.spec.ts

      - name: Norway bank reconciliation suggestion regression
        run: yarn test tests/testNorwayBankReconciliation.spec.ts

      - name: Payment method account regression
        run: yarn test models/baseModels/tests/testPayment.spec.ts

      - name: Norway persistence regression
        run: yarn test tests/testNorwayPersistence.spec.ts

      - name: Build application
        run: yarn build --nopackage

      - name: Package Linux AppImage
        shell: bash
        run: |
          : > log_creds.txt
          yarn build --nosign --linux AppImage --x64 --publish never
          APPIMAGE="$(find dist_electron/bundled -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -d squashfs-root/usr

      - name: Smoke-run packaged AppImage
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/norway-app-home"
          set +e

          if command -v xvfb-run >/dev/null 2>&1; then
            HOME="$RUNNER_TEMP/norway-app-home" \
              timeout --kill-after=5s 20s xvfb-run -a squashfs-root/AppRun --no-sandbox \
              >"$RUNNER_TEMP/norway-app-smoke.log" 2>&1
          else
            APPDIR="$PWD/squashfs-root" \
              HOME="$RUNNER_TEMP/norway-app-home" \
              timeout --kill-after=5s 20s squashfs-root/AppRun \
              --no-sandbox \
              --disable-gpu \
              --ozone-platform=headless \
              >"$RUNNER_TEMP/norway-app-smoke.log" 2>&1
          fi

          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ] && [ "$STATUS" -ne 137 ]; then
            cat "$RUNNER_TEMP/norway-app-smoke.log"
            exit "$STATUS"
          fi

          echo "Packaged application started successfully (status $STATUS)."

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: frappe-books-norway-linux-x64
          path: dist_electron/bundled/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        run: yarn lint
